{% extends 'base.html' %}

{% block title %}Удалить новость - Новостной портал{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-danger text-white">
                <h2 class="card-title mb-0"><i class="fas fa-trash"></i> Подтверждение удаления</h2>
            </div>
            <div class="card-body">
                <p>Вы действительно хотите удалить новость "<strong>{{ news.title }}</strong>"?</p>
                <p class="text-muted">Это действие нельзя отменить.</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> Удалить</button>
                    <a href="{% url 'news_detail' news.id %}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
