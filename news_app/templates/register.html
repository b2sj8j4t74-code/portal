{% extends 'base.html' %}

{% block title %}Регистрация - Новостной портал{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h2 class="card-title mb-0"><i class="fas fa-user-plus"></i> Регистрация</h2>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success"><i class="fas fa-user-plus"></i> Зарегистрироваться</button>
                </form>
            </div>
        </div>
        <p class="text-center mt-3">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
    </div>
</div>
{% endblock %}
