{% extends 'base.html' %}

{% block title %}Профиль - Новостной портал{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-warning text-dark">
                <h2 class="card-title mb-0"><i class="fas fa-user"></i> Профиль пользователя</h2>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-warning"><i class="fas fa-save"></i> Обновить</button>
                </form>
            </div>
        </div>
        <div class="card mt-3">
            <div class="card-body">
                <h5>Опасная зона</h5>
                <p>Удаление аккаунта необратимо.</p>
                <a href="{% url 'delete_profile' %}" class="btn btn-danger"><i class="fas fa-trash"></i> Удалить аккаунт</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
