{% extends 'base.html' %}

{% block title %}Вход - Новостной портал{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-info text-white">
                <h2 class="card-title mb-0"><i class="fas fa-sign-in-alt"></i> Вход</h2>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-info"><i class="fas fa-sign-in-alt"></i> Войти</button>
                </form>
            </div>
        </div>
        <p class="text-center mt-3">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
    </div>
</div>
{% endblock %}
